id: io.github.VendorBuyMVP.Inkwell
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: inkwell

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11

modules:
  - name: inkwell
    buildsystem: simple
    build-commands:
      - cp -r app /app/app
      - install -Dm755 scripts/run-linux.sh /app/bin/inkwell
      - install -Dm644 packaging/linux/io.github.VendorBuyMVP.Inkwell.desktop /app/share/applications/io.github.VendorBuyMVP.Inkwell.desktop
      - install -Dm644 packaging/linux/io.github.VendorBuyMVP.Inkwell.metainfo.xml /app/share/metainfo/io.github.VendorBuyMVP.Inkwell.metainfo.xml
      - install -Dm644 app/assets/icons/inkwell-64.png /app/share/icons/hicolor/64x64/apps/io.github.VendorBuyMVP.Inkwell.png
      - install -Dm644 app/assets/icons/inkwell-128.png /app/share/icons/hicolor/128x128/apps/io.github.VendorBuyMVP.Inkwell.png
      - install -Dm644 app/assets/icons/inkwell-256.png /app/share/icons/hicolor/256x256/apps/io.github.VendorBuyMVP.Inkwell.png
      - install -Dm644 app/assets/icons/inkwell-512.png /app/share/icons/hicolor/512x512/apps/io.github.VendorBuyMVP.Inkwell.png
      - install -Dm644 LICENSE /app/share/licenses/io.github.VendorBuyMVP.Inkwell/LICENSE
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .github
          - .flatpak-builder
          - AGENTS.md
          - build
          - dist
          - docs
          - node_modules
          - tests
